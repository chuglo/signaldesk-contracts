[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signaldesk-contracts"
version = "0.1.0"
description = "SignalDesk contracts skeleton"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic>=2.11,<3"]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/signaldesk_contracts"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
